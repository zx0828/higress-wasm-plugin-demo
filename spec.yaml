info:
  title: higress-mcp-signature-plugin
  version: 1.0.0
  description: "Enterprise MCP Signature Plugin for Higress"
  category: auth
  iconUrl: ""
  contact:
    name: higress
    url: https://github.com/alibaba/higress
    email: higress@googlegroups.com
spec:
  phase: AUTH
  priority: 1000
  configSchema:
    openAPIV3Schema:
      type: object
      properties:
        accessKey:
          type: string
          description: "API Access Key"
        accessSecret:
          type: string
          description: "API Access Secret"
        timestamp:
          type: string
          description: "Optional fixed timestamp (milliseconds)"
        pathPrefixes:
          type: array
          items:
            type: string
          description: "Route prefixes to intercept (default: ['/mcp/'])"
